<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Brave Little Shrimp</title>
<style>
  @font-face {
    font-family: "Montserrat";
    src: url("fonts/Montserrat-latin.woff2") format("woff2");
    font-weight: 100 900;
  }
  :root { --bg: #EEF3F8; --fg: #102A43; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font-family: Montserrat, system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
  #stage { height: min(86vh, 1920px); aspect-ratio: 9 / 16; background: #fff;
    box-shadow: 0 20px 60px rgba(16, 42, 67, .18); border-radius: 12px; cursor: pointer; }
  .bar { display: flex; gap: 12px; align-items: center; font-size: 14px; font-weight: 600; }
  input[type=range] { width: min(60vw, 420px); }
  body.render { background: #fff; }
  body.render #stage { height: auto; width: 1080px; border-radius: 0; box-shadow: none; }
  body.render .bar { display: none; }
</style>
</head>
<body>
<canvas id="stage" width="1080" height="1920"></canvas>
<div class="bar">
  <button id="play">▶ Play</button>
  <input id="scrub" type="range" min="0" max="30" step="0.01" value="0">
  <span id="time">0.00s</span>
</div>
<audio id="audio" src="audio/soundtrack.wav" preload="auto"></audio>
<script src="animation.js"></script>
</body>
</html>
